<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius Web Builder - Editor</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        body { 
            margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #0b0c10; color: #c5c6c7; overflow: hidden;
        }
        
        /* -- PANEL KIRI -- */
        #sidebar-kiri { 
            width: 250px; background: #1f2833; padding: 20px; 
            border-right: 2px solid #66fcf1; box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 2000; transition: margin-left 0.4s ease; overflow-y: auto; 
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar-tersembunyi { margin-left: -300px; }
        #sidebar-kiri h2 { color: #66fcf1; margin-top: 0; margin-bottom: 5px;}
        
        .btn-aksi-panel {
            background: transparent; color: #66fcf1; border: 1px solid #66fcf1;
            padding: 5px 10px; cursor: pointer; border-radius: 5px; font-weight: bold;
            transition: 0.3s; margin-bottom: 20px; width: 100%;
        }
        .btn-aksi-panel:hover { background: #66fcf1; color: #0b0c10; }
        
        /* -- PEMBUNGKUS KANVAS (Agar UI tidak ikut tergulung) -- */
        #kanvas-wrapper {
            flex-grow: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; background-color: #0b0c10;
        }

        /* UI TETAP (Fixed UI) */
        #btn-buka-panel {
            position: absolute; top: 20px; left: 20px; background: #1f2833;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); width: auto; z-index: 1000; display: none;
        }

        #nama-desain-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(31, 40, 51, 0.8); padding: 8px 20px; border-radius: 30px;
            border: 1px solid #45a29e; display: flex; align-items: center; gap: 10px; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #nama-desain-container input {
            background: transparent; border: none; color: #66fcf1; font-size: 16px;
            font-weight: bold; text-align: center; outline: none; font-family: inherit; width: 250px;
        }
        #nama-desain-container input::placeholder { color: #45a29e; }

        #status-simpan {
            position: absolute; top: 20px; right: 20px; background: rgba(31, 40, 51, 0.8);
            color: #27ae60; padding: 8px 15px; border-radius: 20px; font-size: 14px;
            font-weight: bold; z-index: 1000; transition: all 0.3s ease;
        }
        
        #btn-pratinjau {
            position: absolute; bottom: 30px; right: 30px; background: #f39c12; color: #fff;
            border: none; padding: 15px 25px; border-radius: 30px; font-weight: bold; font-size: 16px;
            cursor: pointer; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s;
        }
        #btn-pratinjau:hover { background: #e67e22; transform: scale(1.05); }

        /* -- AREA KANVAS (Yang Bisa Di-Scroll) -- */
        #canvas { 
            flex-grow: 1; overflow-y: auto; overflow-x: hidden; position: relative; 
            /* Memberikan ruang scroll yang halus */
            scroll-behavior: smooth;
        }
        
        /* Area Kerja Aktual (Tinggi bisa disesuaikan) */
        #ruang-kerja {
            width: 100%; min-height: 2000px; position: relative; background-color: transparent;
        }

        .teks-kanvas { color: #66fcf1; opacity: 0.1; text-align: center; padding-top: 20%; font-size: 2em; user-select: none; z-index: 0; pointer-events: none;}

        /* -- MENU MENGAMBANG -- */
        #menu-mengambang {
            position: absolute; background: #1f2833; border: 2px solid #66fcf1;
            border-radius: 8px; padding: 12px; display: none; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); z-index: 2000; transition: opacity 0.2s; 
        }
        #menu-mengambang::after {
            content: ''; position: absolute; bottom: -10px; left: 20px;
            border-width: 10px 10px 0; border-style: solid; border-color: #66fcf1 transparent transparent transparent;
        }
        
        .baris-kontrol { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .kontrol-item { display: flex; align-items: center; gap: 5px; }
        .kontrol-item label { color: #c5c6c7; font-size: 12px; font-weight: bold; }
        
        #menu-mengambang input[type="color"] { width: 30px; height: 30px; padding: 0; border: none; cursor: pointer; border-radius: 5px; background: none; }
        #menu-mengambang input[type="number"], #menu-mengambang input[type="text"], #menu-mengambang select {
            padding: 5px; border-radius: 5px; border: none; background: #0b0c10; color: #66fcf1; font-size: 12px; font-family: inherit;
        }
        #menu-mengambang input[type="number"] { width: 60px; }
        #menu-mengambang input[type="text"] { width: 120px; }
        
        .btn-mini-aksi { background: #2c3e50; color: #66fcf1; border: 1px solid #45a29e; border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: 14px; transition: 0.3s;}
        .btn-mini-aksi:hover { background: #45a29e; color: #0b0c10; }
        .btn-mini-hapus { background: #c0392b; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 14px; transition: 0.3s; margin-left: auto;}
        .btn-mini-hapus:hover { background: #e74c3c; }

        /* Editor LaTeX */
        #kontrol-rumus textarea {
            width: 100%; box-sizing: border-box; background: #0b0c10; color: #f39c12;
            border: 1px solid #45a29e; border-radius: 5px; padding: 8px; font-family: monospace;
            resize: vertical; font-size: 14px; margin-top: 5px;
        }
        .grid-simbol { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; max-width: 320px;}
        .grid-simbol button { flex: 1 1 12%; padding: 4px; font-size: 12px;}

        /* -- GAYA TOMBOL MENU KIRI -- */
        .grup-tombol { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .pembatas-menu { border-top: 1px solid #45a29e; margin: 15px 0; padding-top: 15px; color: #45a29e; font-size: 14px; font-weight: bold; }
        .btn { background: #66fcf1; color: #0b0c10; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #45a29e; color: white; }
        .btn-matematika { background: #f39c12; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-matematika:hover { background: #e67e22; }
        
        .area-sistem { margin-top: auto; padding-top: 20px; }
        .btn-sistem { background: #27ae60; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-sistem:hover { background: #2ecc71; }
        .btn-bahaya { background: #c0392b; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-bahaya:hover { background: #e74c3c; }

        .komponen-aktif { outline: none !important; box-shadow: 0 0 0 3px #f39c12, 0 5px 15px rgba(0,0,0,0.5) !important; z-index: 1500 !important; }
        .komponen-terkunci.komponen-aktif { box-shadow: 0 0 0 3px #c0392b, 0 5px 15px rgba(0,0,0,0.5) !important; }

        /* -- GAYA KOMPONEN KANVAS -- */
        .elemen-kotak { width: 100px; height: 100px; background: #45a29e; position: absolute; border: 2px solid #66fcf1; border-radius: 0px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); resize: both; overflow: hidden; }
        .elemen-teks { position: absolute; color: #ffffff; font-size: 24px; padding: 5px 10px; border: 1px dashed transparent; min-width: 50px; }
        .elemen-teks:hover { cursor: grab; border: 1px dashed #66fcf1; }
        .elemen-gambar { position: absolute; width: 150px; height: 100px; background-color: #2c3e50; border: 2px solid #66fcf1; display: flex; justify-content: center; align-items: center; color: #66fcf1; border-radius: 8px; font-size: 12px; resize: both; overflow: hidden; }
        
        .elemen-video { position: absolute; width: 250px; height: 150px; background-color: #000; border: 2px solid #f39c12; display: flex; justify-content: center; align-items: center; color: #fff; border-radius: 8px; font-size: 12px; resize: both; overflow: hidden; }
        .elemen-video iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
        
        .elemen-audio { position: absolute; width: 280px; height: 60px; background-color: #1f2833; border: 2px solid #66fcf1; display: flex; justify-content: center; align-items: center; border-radius: 30px; resize: horizontal; overflow: hidden; }
        .elemen-audio audio { width: 95%; height: 40px; outline: none; pointer-events: none; }
        .placeholder-media { position: absolute; font-size: 12px; color: #66fcf1; pointer-events: none; }

        .elemen-tombol { position: absolute; background: #66fcf1; color: #0b0c10; padding: 10px 20px; border-radius: 20px; font-weight: bold; text-align: center; min-width: 80px; }
        .elemen-rumus { position: absolute; color: #f39c12; font-size: 32px; padding: 10px 15px; min-width: 50px; background: rgba(243, 156, 18, 0.1); border-radius: 5px; cursor: grab; }

        #notifikasi { position: fixed; bottom: 20px; left: 20px; background: #27ae60; color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; z-index: 3000; }

        /* -- MODE PRATINJAU (PREVIEW) -- */
        .mode-pratinjau .teks-kanvas { display: none !important; }
        .mode-pratinjau .komponen-aktif { box-shadow: none !important; }
        .mode-pratinjau .elemen-kotak, .mode-pratinjau .elemen-gambar, .mode-pratinjau .elemen-video, .mode-pratinjau .elemen-audio { border: none !important; resize: none !important; }
        .mode-pratinjau .elemen-teks:hover { border: 1px dashed transparent !important; cursor: default !important; }
        .mode-pratinjau .elemen-rumus { background: transparent !important; cursor: default !important; }
        .mode-pratinjau .elemen-video iframe, .mode-pratinjau .elemen-audio audio { pointer-events: auto !important; }
        .mode-pratinjau .elemen-tombol { cursor: pointer !important; transition: 0.2s; }
        .mode-pratinjau .elemen-tombol:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="sidebar-kiri">
        <button class="btn-aksi-panel" onclick="tutupPanelKiri()">⬅ Tutup Panel</button>
        <h2>🚀 Sirius Web</h2>
        
        <div class="pembatas-menu" style="margin-top: 0;">Dasar Universal</div>
        <div class="grup-tombol">
            <button class="btn" onclick="tambahKomponen('kotak')">+ Kotak</button>
            <button class="btn" onclick="tambahKomponen('teks')">+ Teks</button>
            <button class="btn" onclick="tambahKomponen('gambar')">+ Gambar</button>
            <button class="btn" onclick="tambahKomponen('video')">+ Video</button>
            <button class="btn" onclick="tambahKomponen('audio')">+ Musik</button>
            <button class="btn" onclick="tambahKomponen('tombol')">+ Tombol</button>
        </div>

        <div class="pembatas-menu">Spesialis Edukasi</div>
        <div class="grup-tombol">
            <button class="btn-matematika" onclick="tambahKomponen('rumus')">+ Blok Rumus</button>
        </div>

        <div class="pembatas-menu">Pengaturan Kanvas</div>
        <div style="margin-bottom: 10px;">
            <label style="color: #c5c6c7; font-size: 12px; display: block; margin-bottom: 5px;">Warna Latar:</label>
            <input type="color" id="input-bg-kanvas" oninput="ubahLatarKanvas()" value="#0b0c10" style="width: 100%; height: 35px; padding: 0; border: none; border-radius: 5px; background: none; cursor: pointer;">
        </div>
        <div style="margin-bottom: 10px;">
            <label style="color: #c5c6c7; font-size: 12px; display: block; margin-bottom: 5px;">Gambar Latar (URL):</label>
            <input type="text" id="input-bg-img-kanvas" placeholder="Link gambar..." oninput="ubahLatarKanvas()" style="width: 100%; padding: 8px; border-radius: 5px; border: none; background: #2c3e50; color: #66fcf1; box-sizing: border-box; font-family: inherit; font-size: 12px;">
        </div>
        <!-- FITUR BARU: Mengatur Tinggi Kanvas -->
        <div>
            <label style="color: #c5c6c7; font-size: 12px; display: block; margin-bottom: 5px;">Tinggi Kanvas (px):</label>
            <input type="number" id="input-tinggi-kanvas" value="2000" min="500" step="100" oninput="ubahLatarKanvas()" style="width: 100%; padding: 8px; border-radius: 5px; border: none; background: #2c3e50; color: #66fcf1; box-sizing: border-box; font-family: inherit; font-size: 12px;">
        </div>

        <div class="area-sistem">
            <div class="pembatas-menu" style="margin-top: 0;">Sistem Penyimpanan</div>
            <div class="grup-tombol">
                <button class="btn-sistem" onclick="simpanManual()">💾 Simpan Desain</button>
                <button class="btn-bahaya" onclick="bersihkanKanvas()">🗑 Bersihkan Kanvas</button>
            </div>
        </div>
    </div>

    <!-- PEMBUNGKUS UTAMA UNTUK SCROLLING -->
    <div id="kanvas-wrapper">
        <!-- UI Tetap (Tidak ikut tergulung) -->
        <button id="btn-buka-panel" class="btn-aksi-panel" onclick="bukaPanelKiri()">☰ Buka Panel</button>
        <div id="nama-desain-container">
            <input type="text" id="nama-desain" placeholder="Nama Website Anda..." oninput="simpanNamaDesain()">
        </div>
        <div id="status-simpan">✅ Tersimpan otomatis</div>
        <button id="btn-pratinjau" onclick="togglePratinjau()">👁️ Pratinjau</button>

        <!-- AREA KANVAS (Yang bisa digulir) -->
        <div id="canvas" onclick="klikAreaKosong(event)">
            
            <!-- RUANG KERJA AKTUAL (Tempat komponen diletakkan) -->
            <div id="ruang-kerja">
                <div class="teks-kanvas">Ruang Kerja Inti<br><span style="font-size: 16px; opacity: 0.6;">(Scroll ke bawah untuk ruang yang lebih luas)</span></div>
                
                <!-- MENU MENGAMBANG dipindah ke dalam sini agar menempel dengan komponen -->
                <div id="menu-mengambang">
                    <div class="baris-kontrol">
                        <div class="kontrol-item" id="kontrol-warna">
                            <input type="color" id="input-warna" oninput="ubahWarna('picker')" title="Ubah Warna">
                            <input type="text" id="input-warna-hex" placeholder="#FFFFFF" oninput="ubahWarna('hex')" style="width: 70px;">
                        </div>
                        
                        <div class="kontrol-item" id="kontrol-font" style="display: none;">
                            <label>Font:</label>
                            <select id="input-font" onchange="ubahFont()" style="width: 90px;">
                                <option value="Arial, sans-serif">Arial</option>
                                <option value="'Times New Roman', serif">Times</option>
                                <option value="'Courier New', monospace">Courier</option>
                                <option value="Verdana, sans-serif">Verdana</option>
                                <option value="'Comic Sans MS', cursive">Comic</option>
                            </select>
                        </div>

                        <div class="kontrol-item" id="kontrol-teks" style="display: none;">
                            <label>Ukuran:</label>
                            <input type="number" id="input-ukuran-teks" oninput="ubahUkuranTeks()">
                        </div>
                        
                        <div class="kontrol-item" id="kontrol-bentuk" style="display: none;">
                            <label>Bentuk:</label>
                            <select id="input-bentuk" onchange="ubahBentuk()">
                                <option value="0px">Persegi</option>
                                <option value="15px">Lengkung</option>
                                <option value="50%">Lingkaran</option>
                            </select>
                        </div>
                        
                        <button class="btn-mini-aksi" onclick="duplikatKomponen()" title="Duplikat Komponen">📄</button>
                        <button class="btn-mini-aksi" onclick="pindahLapis(1)" title="Pindah ke Depan">🔼</button>
                        <button class="btn-mini-aksi" onclick="pindahLapis(-1)" title="Pindah ke Belakang">🔽</button>
                        <button class="btn-mini-aksi" id="btn-kunci" onclick="kunciKomponen()" title="Kunci/Buka Komponen">🔓</button>
                        <button class="btn-mini-hapus" onclick="hapusKomponenAktif()" title="Hapus Komponen">🗑️</button>
                    </div>

                    <div class="baris-kontrol" id="kontrol-gambar" style="display: none; width: 100%;">
                        <label id="label-url" style="width: 70px;">URL Link:</label>
                        <input type="text" id="input-url-gambar" placeholder="Tempel link di sini..." oninput="ubahMedia()" style="flex-grow: 1;">
                    </div>

                    <div id="kontrol-rumus" style="display: none; flex-direction: column; border-top: 1px solid #45a29e; padding-top: 10px;">
                        <label style="color: #f39c12; font-size: 12px; font-weight: bold;">Editor Matematika (Format LaTeX):</label>
                        <textarea id="input-latex" rows="3" placeholder="Ketik kode LaTeX..." oninput="ubahRumus()"></textarea>
                        
                        <div class="grid-simbol">
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('^\\circ')" title="Derajat">°</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\frac{a}{b}')" title="Pecahan">a/b</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('x^2')" title="Pangkat">x²</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\sqrt{x}')" title="Akar">√</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\int_{a}^{b}')" title="Integral">∫</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\sum_{i=1}^{n}')" title="Sigma">∑</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\lim_{x \\to \\infty}')" title="Limit">lim</button>
                            
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\begin{bmatrix} a & b & c \\\\ d & e & f \\\\ g & h & i \\end{bmatrix}')" title="Matriks 3x3" style="flex: 1 1 30%;">[ Matriks 3x3 ]</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\begin{pmatrix} x \\\\ y \\end{pmatrix}')" title="Vektor" style="flex: 1 1 20%;">[ Vektor ]</button>

                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\Delta')" title="Delta">Δ</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\alpha')" title="Alpha">α</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\beta')" title="Beta">β</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\pi')" title="Pi">π</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\infty')" title="Tak Terhingga">∞</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\approx')" title="Kira-kira">≈</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\neq')" title="Tidak Sama">≠</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\leq')" title="Kurang Dari Sama">≤</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\geq')" title="Lebih Dari Sama">≥</button>
                            <button class="btn-mini-aksi" onclick="sisipkanSimbol('\\pm')" title="Plus Minus">±</button>
                        </div>
                    </div>
                </div>
            </div> <!-- Akhir Ruang Kerja -->
        </div> <!-- Akhir Canvas -->
    </div> <!-- Akhir Wrapper -->

    <div id="notifikasi">Desain berhasil disimpan!</div>

    <script>
        // --- INISIALISASI ---
        let dataDesainTerakhir = "";
        let komponenTerpilih = null;
        let modePratinjau = false;
        let timerKeyboard; 

        window.onload = function() {
            muatDesain();
            setInterval(simpanDiamDiam, 1000); 
        };

        // --- SISTEM NAMA DESAIN ---
        function simpanNamaDesain() {
            let nama = document.getElementById('nama-desain').value;
            localStorage.setItem('SiriusWebProjectName', nama);
            simpanDiamDiam();
        }

        // --- SISTEM MODE PRATINJAU ---
        function togglePratinjau() {
            modePratinjau = !modePratinjau;
            let canvas = document.getElementById('canvas');
            let sidebar = document.getElementById('sidebar-kiri');
            let btnBuka = document.getElementById('btn-buka-panel');
            let namaDesain = document.getElementById('nama-desain-container');
            let btnPreview = document.getElementById('btn-pratinjau');

            if (modePratinjau) {
                tutupMenuMengambang();
                sidebar.classList.add('sidebar-tersembunyi');
                btnBuka.style.display = 'none';
                namaDesain.style.display = 'none';
                document.getElementById('status-simpan').style.display = 'none';
                
                if(komponenTerpilih) komponenTerpilih.classList.remove('komponen-aktif');
                canvas.classList.add('mode-pratinjau');
                
                btnPreview.innerText = '✏️ Keluar Pratinjau';
                btnPreview.style.background = '#e74c3c';
            } else {
                btnBuka.style.display = 'block';
                namaDesain.style.display = 'flex';
                document.getElementById('status-simpan').style.display = 'block';
                
                canvas.classList.remove('mode-pratinjau');
                btnPreview.innerText = '👁️ Pratinjau';
                btnPreview.style.background = '#f39c12';
            }
        }

        function tutupPanelKiri() {
            document.getElementById('sidebar-kiri').classList.add('sidebar-tersembunyi');
            document.getElementById('btn-buka-panel').style.display = 'block';
        }
        function bukaPanelKiri() {
            document.getElementById('sidebar-kiri').classList.remove('sidebar-tersembunyi');
            document.getElementById('btn-buka-panel').style.display = 'none';
        }

        // --- SISTEM PEMBUATAN KOMPONEN ---
        function tambahKomponen(jenis, posisiKustom = null, isiKustom = null, warnaKustom = null, ukuranKustom = null, bgKustom = null, lebarKustom = null, tinggiKustom = null, radiusKustom = null, zIndexKustom = 1, latexKustom = null, terkunciKustom = 'false', urlKustom = null, fontFamilyKustom = null) {
            let elemenBaru = document.createElement('div');
            
            // Logika Penempatan Awal Cerdas: Berada di posisi yang terlihat pengguna saat scroll
            let scrollY = document.getElementById('canvas').scrollTop;
            let defaultTop = posisiKustom ? posisiKustom.top : (150 + scrollY) + 'px';
            let defaultLeft = posisiKustom ? posisiKustom.left : '350px';
            
            elemenBaru.style.top = defaultTop;
            elemenBaru.style.left = defaultLeft;
            elemenBaru.style.zIndex = zIndexKustom;
            elemenBaru.dataset.terkunci = terkunciKustom;
            if (urlKustom) elemenBaru.dataset.url = urlKustom;
            if (terkunciKustom === 'true') elemenBaru.classList.add('komponen-terkunci');

            if (lebarKustom) elemenBaru.style.width = lebarKustom;
            if (tinggiKustom) elemenBaru.style.height = tinggiKustom;
            if (radiusKustom) elemenBaru.style.borderRadius = radiusKustom;
            if (fontFamilyKustom) elemenBaru.style.fontFamily = fontFamilyKustom;

            switch(jenis) {
                case 'kotak':
                    elemenBaru.className = 'elemen-kotak';
                    elemenBaru.dataset.jenis = 'kotak';
                    if (warnaKustom) elemenBaru.style.backgroundColor = warnaKustom;
                    break;
                case 'teks':
                    elemenBaru.className = 'elemen-teks';
                    elemenBaru.innerText = isiKustom || "Ketik teks...";
                    elemenBaru.contentEditable = "true"; 
                    elemenBaru.dataset.jenis = 'teks';
                    if (warnaKustom) elemenBaru.style.color = warnaKustom;
                    if (ukuranKustom) elemenBaru.style.fontSize = ukuranKustom;
                    break;
                case 'gambar':
                    elemenBaru.className = 'elemen-gambar';
                    elemenBaru.innerText = isiKustom || "Area Gambar"; 
                    elemenBaru.dataset.jenis = 'gambar';
                    if (bgKustom && bgKustom !== "none") {
                        elemenBaru.style.backgroundImage = bgKustom;
                        elemenBaru.style.backgroundSize = "cover";
                        elemenBaru.style.backgroundPosition = "center";
                        elemenBaru.innerText = "";
                    }
                    break;
                case 'video':
                    elemenBaru.className = 'elemen-video';
                    elemenBaru.dataset.jenis = 'video';
                    if (bgKustom && bgKustom !== "none") {
                        let embedUrl = bgKustom.includes('watch?v=') ? bgKustom.replace('watch?v=', 'embed/') : bgKustom;
                        elemenBaru.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
                    } else {
                        elemenBaru.innerHTML = `<div class="placeholder-media">Area Video</div>`;
                    }
                    break;
                case 'audio': 
                    elemenBaru.className = 'elemen-audio';
                    elemenBaru.dataset.jenis = 'audio';
                    if (bgKustom && bgKustom !== "none") {
                        elemenBaru.innerHTML = `<audio src="${bgKustom}" controls></audio>`;
                    } else {
                        elemenBaru.innerHTML = `<div class="placeholder-media">🎵 Area Musik</div><audio controls style="display:none;"></audio>`;
                    }
                    break;
                case 'tombol':
                    elemenBaru.className = 'elemen-tombol';
                    elemenBaru.innerText = isiKustom || "Klik";
                    elemenBaru.contentEditable = "true"; 
                    elemenBaru.dataset.jenis = 'tombol';
                    if (warnaKustom) elemenBaru.style.backgroundColor = warnaKustom;
                    break;
                case 'rumus':
                    elemenBaru.className = 'elemen-rumus';
                    elemenBaru.dataset.jenis = 'rumus';
                    elemenBaru.dataset.latex = latexKustom || "E = mc^2"; 
                    if (warnaKustom) elemenBaru.style.color = warnaKustom;
                    if (ukuranKustom) elemenBaru.style.fontSize = ukuranKustom;
                    
                    if (typeof katex !== 'undefined') {
                        katex.render(elemenBaru.dataset.latex, elemenBaru, { throwOnError: false });
                    } else {
                        elemenBaru.innerText = elemenBaru.dataset.latex;
                    }
                    break;
            }

            if (elemenBaru.contentEditable === "true") {
                elemenBaru.onkeyup = function() { simpanDiamDiam(); };
            }

            // PERUBAHAN: Pasang di dalam ruang-kerja
            document.getElementById('ruang-kerja').appendChild(elemenBaru);
            buatBisaDigeserDanDiklik(elemenBaru);
            
            elemenBaru.ondblclick = function(e) {
                if (modePratinjau) return; 
                e.stopPropagation();
                if(komponenTerpilih === elemenBaru) tutupMenuMengambang();
                elemenBaru.remove();
                simpanDiamDiam();
            };
            
            simpanDiamDiam(); 
        }

        // --- SISTEM DRAG & INTERAKSI PINTAR ---
        function buatBisaDigeserDanDiklik(elemen) {
            let titikXAwal = 0, titikYAwal = 0, posisiX = 0, posisiY = 0;
            let sedangDigeser = false;

            elemen.onmousedown = function(e) {
                if (modePratinjau) {
                    if (elemen.className.includes('elemen-tombol') && elemen.dataset.url) {
                        let link = elemen.dataset.url;
                        if (!link.startsWith('http://') && !link.startsWith('https://')) {
                            link = 'https://' + link; 
                        }
                        window.open(link, '_blank'); 
                    }
                    return; 
                }

                e.stopPropagation(); 
                pilihKomponen(elemen);

                if (elemen.contentEditable === "true" && document.activeElement === elemen) return; 
                if (elemen.dataset.terkunci === 'true') return;

                let rect = elemen.getBoundingClientRect();
                let isResizeArea = (e.clientX > rect.right - 20) && (e.clientY > rect.bottom - 20);
                if ((elemen.className.includes('kotak') || elemen.className.includes('gambar') || elemen.className.includes('video') || elemen.className.includes('audio')) && isResizeArea) {
                    return; 
                }

                e.preventDefault();
                titikXAwal = e.clientX;
                titikYAwal = e.clientY;
                sedangDigeser = false;
                
                document.onmousemove = geserElemen;
                document.onmouseup = hentikanGeser;
            };

            function geserElemen(e) {
                e.preventDefault();
                sedangDigeser = true; 
                posisiX = titikXAwal - e.clientX;
                posisiY = titikYAwal - e.clientY;
                titikXAwal = e.clientX;
                titikYAwal = e.clientY;
                
                elemen.style.top = (elemen.offsetTop - posisiY) + "px";
                elemen.style.left = (elemen.offsetLeft - posisiX) + "px";

                document.getElementById('menu-mengambang').style.opacity = '0';
                document.getElementById('menu-mengambang').style.pointerEvents = 'none';
            }

            function hentikanGeser(e) {
                document.onmouseup = null;
                document.onmousemove = null;
                
                if (!sedangDigeser && elemen.contentEditable === "true") {
                    elemen.focus();
                }
                if (sedangDigeser) {
                    simpanDiamDiam();
                    if (komponenTerpilih === elemen) {
                        posisikanMenu(elemen);
                        document.getElementById('menu-mengambang').style.opacity = '1';
                        document.getElementById('menu-mengambang').style.pointerEvents = 'auto';
                    }
                }
            }
        }

        // --- SISTEM MENU MENGAMBANG ---
        function rgbKeHex(rgb) {
            if(!rgb || rgb === 'none' || rgb === 'transparent') return '#ffffff';
            let a = rgb.split("(")[1].split(")")[0];
            a = a.split(",");
            let b = a.map(function(x) {             
                x = parseInt(x).toString(16);
                return (x.length==1) ? "0"+x : x;
            });
            return "#" + b.join("");
        }

        function pilihKomponen(elemen) {
            if (komponenTerpilih) {
                komponenTerpilih.classList.remove('komponen-aktif');
            }

            komponenTerpilih = elemen;
            komponenTerpilih.classList.add('komponen-aktif');

            let menu = document.getElementById('menu-mengambang');
            menu.style.opacity = '1';
            menu.style.pointerEvents = 'auto';

            let btnKunci = document.getElementById('btn-kunci');
            if (elemen.dataset.terkunci === 'true') {
                btnKunci.innerText = '🔒';
            } else {
                btnKunci.innerText = '🔓';
            }

            document.getElementById('kontrol-teks').style.display = 'none';
            document.getElementById('kontrol-font').style.display = 'none';
            document.getElementById('kontrol-gambar').style.display = 'none';
            document.getElementById('kontrol-bentuk').style.display = 'none';
            document.getElementById('kontrol-rumus').style.display = 'none';

            let warnaElemen = window.getComputedStyle(elemen).color;
            if (elemen.className.includes('kotak') || elemen.className.includes('tombol') || elemen.className.includes('audio')) {
                warnaElemen = window.getComputedStyle(elemen).backgroundColor;
            }
            let warnaHex = warnaElemen.includes('rgb') ? rgbKeHex(warnaElemen) : warnaElemen;
            document.getElementById('input-warna').value = warnaHex;
            document.getElementById('input-warna-hex').value = warnaHex;

            if (elemen.className.includes('teks') || elemen.className.includes('tombol') || elemen.className.includes('rumus')) {
                document.getElementById('kontrol-teks').style.display = 'flex';
                let fontSaatIni = window.getComputedStyle(elemen).fontSize;
                document.getElementById('input-ukuran-teks').value = parseInt(fontSaatIni);

                if (elemen.className.includes('teks') || elemen.className.includes('tombol')) {
                     document.getElementById('kontrol-font').style.display = 'flex';
                     let familySaatIni = window.getComputedStyle(elemen).fontFamily;
                     if (familySaatIni.includes('Times')) document.getElementById('input-font').value = "'Times New Roman', serif";
                     else if (familySaatIni.includes('Courier')) document.getElementById('input-font').value = "'Courier New', monospace";
                     else if (familySaatIni.includes('Verdana')) document.getElementById('input-font').value = "Verdana, sans-serif";
                     else if (familySaatIni.includes('Comic')) document.getElementById('input-font').value = "'Comic Sans MS', cursive";
                     else document.getElementById('input-font').value = "Arial, sans-serif";
                }
            } 
            if (elemen.className.includes('gambar') || elemen.className.includes('video') || elemen.className.includes('audio') || elemen.className.includes('tombol')) {
                document.getElementById('kontrol-gambar').style.display = 'flex';
                let labelUrl = document.getElementById('label-url');

                if (elemen.className.includes('tombol')) {
                    labelUrl.innerText = "Link Tujuan:";
                    document.getElementById('input-url-gambar').value = elemen.dataset.url || "";
                } else if (elemen.className.includes('video')) {
                    labelUrl.innerText = "URL Video:";
                    let iframe = elemen.querySelector('iframe');
                    document.getElementById('input-url-gambar').value = iframe ? iframe.src : "";
                } else if (elemen.className.includes('audio')) {
                    labelUrl.innerText = "URL Audio:";
                    let audio = elemen.querySelector('audio');
                    document.getElementById('input-url-gambar').value = (audio && audio.src) ? audio.src : "";
                } else {
                    labelUrl.innerText = "URL Gambar:";
                    let bgImg = elemen.style.backgroundImage;
                    document.getElementById('input-url-gambar').value = bgImg !== "none" ? bgImg.slice(5, -2) : "";
                }
            } 
            if (elemen.className.includes('kotak')) {
                document.getElementById('kontrol-bentuk').style.display = 'flex';
                let radiusSaatIni = window.getComputedStyle(elemen).borderRadius;
                if (radiusSaatIni === '50%') document.getElementById('input-bentuk').value = '50%';
                else if (radiusSaatIni === '0px') document.getElementById('input-bentuk').value = '0px';
                else document.getElementById('input-bentuk').value = '15px';
            }
            if (elemen.className.includes('rumus')) {
                document.getElementById('kontrol-rumus').style.display = 'flex';
                document.getElementById('input-latex').value = elemen.dataset.latex || "";
            }

            posisikanMenu(elemen);
            menu.style.display = 'flex';
        }

        function posisikanMenu(elemen) {
            let menu = document.getElementById('menu-mengambang');
            let tinggiMenu = menu.offsetHeight || 60;
            menu.style.top = (elemen.offsetTop - tinggiMenu - 15) + "px"; 
            menu.style.left = elemen.offsetLeft + "px";
        }

        function ubahWarna(sumber) {
            if (!komponenTerpilih) return;

                warnaBaru = document.getElementById('input-warna').value;
                document.getElementById('input-warna-hex').value = warnaBaru;
            } else {
                warnaBaru = document.getElementById('input-warna-hex').value;

                    document.getElementById('input-warna').value = warnaBaru;

            }

        function duplikatKomponen() {
            if (!komponenTerpilih) return;
            
            let bgData = komponenTerpilih.style.backgroundImage;
            if (komponenTerpilih.dataset.jenis === 'video') {
                let iframe = komponenTerpilih.querySelector('iframe');
                bgData = iframe ? iframe.src : "";

                isi: komponenTerpilih.innerText,

                bg: bgData,
                lebar: window.getComputedStyle(komponenTerpilih).width,
                tinggi: window.getComputedStyle(komponenTerpilih).height,
                radius: window.getComputedStyle(komponenTerpilih).borderRadius,
                zindex: parseInt(komponenTerpilih.style.zIndex || 1) + 1,
                latex: komponenTerpilih.dataset.latex,
                terkunci: 'false',
                url: komponenTerpilih.dataset.url || "",
                fontFamily: window.getComputedStyle(komponenTerpilih).fontFamily
            };
            
            tambahKomponen(data.jenis, {top: data.top, left: data.left}, data.isi, data.warna, data.ukuran, data.bg, data.lebar, data.tinggi, data.radius, data.zindex, data.latex, data.terkunci, data.url, data.fontFamily);

                document.getElementById('btn-kunci').innerText = '🔓';
            } else {
                komponenTerpilih.dataset.terkunci = 'true';
                komponenTerpilih.classList.add('komponen-terkunci');
                document.getElementById('btn-kunci').innerText = '🔒';

        // --- Kontrol Keyboard ---
        document.addEventListener('keydown', function(e) {
            if (modePratinjau) return;
            const activeEl = document.activeElement;
            if (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable) return;

            if (komponenTerpilih) {
                if (e.key === 'Delete') {
                    hapusKomponenAktif();
                    return;
                }
                
                if (komponenTerpilih.dataset.terkunci === 'true' && e.key.includes('Arrow')) return;

                let step = e.shiftKey ? 10 : 1; 
                let top = parseInt(komponenTerpilih.style.top || 0);
                let left = parseInt(komponenTerpilih.style.left || 0);
                let moved = false;

                if (e.key === 'ArrowUp') { top -= step; moved = true; e.preventDefault(); }
                if (e.key === 'ArrowDown') { top += step; moved = true; e.preventDefault(); }
                if (e.key === 'ArrowLeft') { left -= step; moved = true; e.preventDefault(); }
                if (e.key === 'ArrowRight') { left += step; moved = true; e.preventDefault(); }

                if (moved) {
                    komponenTerpilih.style.top = top + 'px';
                    komponenTerpilih.style.left = left + 'px';
                    
                    document.getElementById('menu-mengambang').style.opacity = '0';
                    document.getElementById('menu-mengambang').style.pointerEvents = 'none';
                }
            }
        });

        document.addEventListener('keyup', function(e) {
            if (modePratinjau) return;
            if (komponenTerpilih && e.key.includes('Arrow')) {
                clearTimeout(timerKeyboard);
                simpanDiamDiam(); 
                timerKeyboard = setTimeout(() => {
                    posisikanMenu(komponenTerpilih);
                    document.getElementById('menu-mengambang').style.opacity = '1';
                    document.getElementById('menu-mengambang').style.pointerEvents = 'auto';
                }, 200); 
            }
        });

        function tutupMenuMengambang() {
            if (komponenTerpilih) {
                komponenTerpilih.classList.remove('komponen-aktif');
                komponenTerpilih = null;
            }
            document.getElementById('menu-mengambang').style.display = 'none';
        }

        function hapusKomponenAktif() {
            if (komponenTerpilih) {
                komponenTerpilih.remove();
                tutupMenuMengambang();
                simpanDiamDiam();
            }
        }

            if (e.target.closest('#menu-mengambang') || e.target.closest('#nama-desain-container')) return;
            if (e.target.id === 'canvas' || e.target.id === 'ruang-kerja' || e.target.className === 'teks-kanvas') {
                tutupMenuMengambang();

        // --- SISTEM PENYIMPANAN LOKAL (BRANKAS) ---
        function simpanManual() {
            simpanDiamDiam(true); 
            let notif = document.getElementById('notifikasi');
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        function simpanDiamDiam(paksaSimpan = false) {
            let ruangKerja = document.getElementById('ruang-kerja');
            let semuaKomponen = ruangKerja.children;
            let dataDesain = [];

            for (let i = 0; i < semuaKomponen.length; i++) {
                let elemen = semuaKomponen[i];
                if (elemen.dataset.jenis) {
                    let bgData = elemen.style.backgroundImage;
                    if (elemen.dataset.jenis === 'video') {
                        let iframe = elemen.querySelector('iframe');
                        bgData = iframe ? iframe.src : "";
                    } else if (elemen.dataset.jenis === 'audio') {
                        let audio = elemen.querySelector('audio');
                        bgData = audio ? audio.src : "";
                    }

                    dataDesain.push({
                        jenis: elemen.dataset.jenis,
                        top: elemen.style.top,
                        left: elemen.style.left,
                        isi: elemen.innerText,
                        warna: elemen.style.color || elemen.style.backgroundColor,
                        ukuran: elemen.style.fontSize,
                        bg: bgData,
                        lebar: elemen.style.width,
                        tinggi: elemen.style.height,
                        radius: elemen.style.borderRadius,
                        zindex: elemen.style.zIndex || 1,
                        latex: elemen.dataset.latex,
                        terkunci: elemen.dataset.terkunci || 'false',
                        url: elemen.dataset.url || "",
                        fontFamily: elemen.style.fontFamily 
                    });
                }
            }

            let dataString = JSON.stringify(dataDesain);

            if (dataString !== dataDesainTerakhir || paksaSimpan) {
                let status = document.getElementById('status-simpan');
                status.innerText = "⏳ Menyimpan...";
                status.style.color = "#f39c12"; 

                localStorage.setItem('SiriusWebSaveData', dataString);
                dataDesainTerakhir = dataString;

                setTimeout(() => {
                    status.innerText = "✅ Tersimpan otomatis";
                    status.style.color = "#27ae60";
                }, 500);
            }
        }

        function muatDesain() {
            let savedName = localStorage.getItem('SiriusWebProjectName');
            if (savedName) document.getElementById('nama-desain').value = savedName;

            let bgInputs = localStorage.getItem('SiriusWebBgInputs');
            if (bgInputs) {
                let bg = JSON.parse(bgInputs);
                document.getElementById('input-bg-kanvas').value = bg.warna || "#0b0c10";
                document.getElementById('input-bg-img-kanvas').value = bg.gambar || "";
                
                // Setel nilai input tinggi jika sudah pernah disimpan, jika tidak default 2000
                document.getElementById('input-tinggi-kanvas').value = bg.tinggi || "2000";
                ubahLatarKanvas(); 
            } else {
                // Jika belum pernah disetel, panggil fungsi untuk set default
                ubahLatarKanvas();
            }

            let dataTersimpan = localStorage.getItem('SiriusWebSaveData');
            if (dataTersimpan) {
                let dataDesain = JSON.parse(dataTersimpan);
                dataDesain.forEach(item => {
                    tambahKomponen(item.jenis, { top: item.top, left: item.left }, item.isi, item.warna, item.ukuran, item.bg, item.lebar, item.tinggi, item.radius, item.zindex, item.latex, item.terkunci, item.url, item.fontFamily);
                });
            }
        }

        function ubahLatarKanvas() {
            let warna = document.getElementById('input-bg-kanvas').value;
            let urlImg = document.getElementById('input-bg-img-kanvas').value;
            let tinggiKanvas = document.getElementById('input-tinggi-kanvas').value;
            let ruangKerja = document.getElementById('ruang-kerja'); // Area yang diubah

            ruangKerja.style.backgroundColor = warna;
            ruangKerja.style.minHeight = tinggiKanvas + 'px';
            
            if (urlImg) {
                ruangKerja.style.backgroundImage = `url('${urlImg}')`;
                ruangKerja.style.backgroundSize = "cover";
                ruangKerja.style.backgroundPosition = "center";
            } else {
                ruangKerja.style.backgroundImage = "none";
            }
            
            localStorage.setItem('SiriusWebBgInputs', JSON.stringify({ warna: warna, gambar: urlImg, tinggi: tinggiKanvas }));
        }

        function bersihkanKanvas() {
            if(confirm("Yakin ingin menghapus semua elemen dari kanvas?")) {
                let ruangKerja = document.getElementById('ruang-kerja');
                let semuaKomponen = ruangKerja.querySelectorAll('[data-jenis]'); 
                
                semuaKomponen.forEach(elemen => {
                    elemen.remove();
                });
                
                localStorage.removeItem('SiriusWebSaveData');
                simpanDiamDiam(true);
                tutupMenuMengambang();
            }
        }
    </script>
</body>
</html>
