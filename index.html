<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius Web Builder</title>
    <style>
        /* Pengaturan Dasar dan Tema Warna */
        body { 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            font-family: Arial, sans-serif; 
            background-color: #0b0c10; 
            color: #c5c6c7; 
        }
        
        /* Area Menu Samping */
        #sidebar { 
            width: 250px; 
            background: #1f2833; 
            padding: 20px; 
            border-right: 2px solid #66fcf1; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        
        #sidebar h2 { color: #66fcf1; margin-top: 0; }
        
        /* Area Kanvas Kosong */
        #canvas { 
            flex-grow: 1; 
            position: relative; 
            overflow: hidden; 
        }

        /* Teks Latar Belakang Kanvas */
        .teks-kanvas {
            color: #66fcf1; 
            opacity: 0.1; 
            text-align: center; 
            margin-top: 20%;
            font-size: 2em;
            user-select: none;
        }
        
        /* Desain Tombol */
        .btn { 
            background: #66fcf1; 
            color: #0b0c10; 
            border: none; 
            padding: 10px 15px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: 100%; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .btn:hover { background: #45a29e; color: white; }
        
        /* Desain Kotak yang Akan Muncul */
        .elemen-kotak { 
            width: 100px; 
            height: 100px; 
            background: #45a29e; 
            position: absolute; 
            top: 50px; 
            left: 50px; 
            border: 2px solid #66fcf1; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Panel Sebelah Kiri -->
    <div id="sidebar">
        <h2>🚀 Sirius Web</h2>
        <p>Panel Komponen</p>
        <button class="btn" onclick="tambahKotak()">+ Tambah Kotak</button>
    </div>

    <!-- Area Kerja Utama -->
    <div id="canvas">
        <div class="teks-kanvas">Kanvas Kosong Alam Semesta</div>
    </div>

    <!-- Sistem Logika (JavaScript) -->
    <script>
        function tambahKotak() {
            // Membuat kotak baru saat tombol diklik
            let kotakBaru = document.createElement('div');
            kotakBaru.className = 'elemen-kotak';
            
            // Meletakkan kotak ke dalam kanvas
            document.getElementById('canvas').appendChild(kotakBaru);
        }
    </script>

</body>
</html>
